# Konfigurasi AndroidX
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# Menambah memori JVM untuk Gradle agar tidak OutOfMemoryError (3GB RAM)
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Optimasi proses build
org.gradle.parallel=true
org.gradle.caching=true

# Mengaktifkan mode penuh R8 untuk pengoptimalan DEX maksimal
android.enableR8.fullMode=true
